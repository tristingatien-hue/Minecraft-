modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/tristingatien-hue/Minecraft-/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "tristingatien-hue, Claude"
description = '''
Industrial warfare for Create-style packs: big cannons built from stackable
barrel blocks, auto-targeting autocannon turrets, radar detection, and
radar-linked fire control. Every balance value is configurable in
config/createwarworks-common.toml.

Inspired by Create Big Cannons and Create: Radars, rebuilt as one mod.
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[1.21,1.21.2)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "create"
type = "optional"
versionRange = "[6.0.0,)"
ordering = "AFTER"
side = "BOTH"
